<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentRewards dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-3xl items-center px-6 py-12">
      <section class="w-full rounded-3xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
        <header class="mb-8 flex items-start justify-between gap-4">
          <div>
            <p class="text-sm font-medium uppercase tracking-widest text-cyan-400">
              RentRewards
            </p>
            <h1 class="mt-2 text-3xl font-semibold">March rewards</h1>
          </div>
          <span
            data-streak
            class="rounded-full bg-violet-500/15 px-3 py-1 text-sm font-medium text-violet-300"
          ></span>
        </header>

        <div class="mb-8">
          <p class="text-sm text-slate-400">Points this month</p>
          <p data-points class="mt-1 text-5xl font-bold tracking-tight"></p>
          <div class="mt-4 h-2 overflow-hidden rounded-full bg-slate-800">
            <div
              data-progress
              class="h-full rounded-full bg-cyan-400 transition-all"
            ></div>
          </div>
          <p data-progress-label class="mt-2 text-xs text-slate-500"></p>
        </div>

        <article data-status aria-live="polite">
          <h2 data-status-title class="font-semibold"></h2>
          <p data-status-description class="mt-1 text-sm opacity-80"></p>
        </article>
      </section>
    </main>

    <script type="module">
      import { renderDashboard } from "./dashboard.js";

      // Preview data. The production application would receive the same
      // shape from PointsResult and MemberAccount. Use ?outcome=DUPLICATE or
      // ?outcome=CAPPED to preview the other states.
      const previews = {
        AWARDED: { pointsAwarded: 1500, pointsThisMonth: 82500 },
        DUPLICATE: { pointsAwarded: 0, pointsThisMonth: 82500 },
        CAPPED: { pointsAwarded: 0, pointsThisMonth: 100000 },
      };
      const requested = new URLSearchParams(location.search).get("outcome");
      const outcome = Object.hasOwn(previews, requested) ? requested : "AWARDED";
      const preview = previews[outcome];

      renderDashboard(
        { pointsAwarded: preview.pointsAwarded, outcome },
        {
          pointsThisMonth: preview.pointsThisMonth,
          monthlyCap: 100000,
          streakMonths: 6,
        },
      );
    </script>
  </body>
</html>
